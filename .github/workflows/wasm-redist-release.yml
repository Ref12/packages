name: wasm-redist-release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=10.0.12
          for id in microsoft.netcore.app.runtime.mono.multithread.browser-wasm microsoft.net.webassembly.threading microsoft.net.sdk.webassembly.pack; do
            curl -sSfLO https://api.nuget.org/v3-flatcontainer/$id/$V/$id.$V.nupkg
          done
          gh release create v$V -R Ref12/packages --title "dotnet wasm redistributables $V" --notes "MIT redistributables from nuget.org" *.nupkg
          for f in *.nupkg; do
            gh workflow run publish.yml -R Ref12/packages -f repo=Ref12/packages -f tag=v$V -f asset=$f
          done
